name: Build release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate system
        run: node tools/validate-system.mjs

      - name: Build compendium packs and package system
        run: npm run package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$((Get-Content system.json -Raw | ConvertFrom-Json).version)"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/trudvang-chronicles.zip --clobber
            Write-Output "Release $tag mise a jour."
          } else {
            gh release create $tag dist/trudvang-chronicles.zip --title "Trudvang Chronicles $tag" --generate-notes
            Write-Output "Release $tag creee."
          }
